<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LAAC術前CTシミュレーション動画</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* Layout: one narrow reading column for phones; numbered blocks mirror the poster's section numbers */
:root{
  --bg:#FFFFFF; --fg:#1A1F2B; --muted:#5B6573; --rule:#D9DDE3; --navy:#1F4E8C; --orange:#C2571A; --tint:#F3F6FA; --video:#111316;
  --sans:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151B; --fg:#E8EBF0; --muted:#9AA4B2; --rule:#2C333E; --navy:#7FA8E0; --orange:#E8935A; --tint:#1A2029; --video:#000; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151B; --fg:#E8EBF0; --muted:#9AA4B2; --rule:#2C333E; --navy:#7FA8E0; --orange:#E8935A; --tint:#1A2029; --video:#000; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px;
  word-break:auto-phrase;line-break:strict}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px;border-bottom:3px solid var(--navy);padding-bottom:14px}
.eyebrow{font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.12em;margin:0}
h1{font-size:clamp(20px,5.2vw,28px);line-height:1.35;margin:0;text-wrap:balance}
.by{font-size:13px;color:var(--muted);margin:0}
.note{font-size:13px;color:var(--muted);background:var(--tint);padding:10px 12px;margin:0}
section{display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--navy);padding-bottom:6px}
.sn{font-size:22px;font-weight:700;color:var(--navy);line-height:1}
h2{font-size:18px;margin:0;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
video{width:100%;max-width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--video);display:block}
video.wide{aspect-ratio:4/3}
figcaption{font-size:14px;line-height:1.5}
figcaption b{color:var(--navy)}
figcaption .o{color:var(--orange);font-weight:700}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px}
</style>
</head>
<body>


<div class="wrap">
<header>
  <p class="eyebrow">STRUCTURE CLUB 2026 ｜ 一般演題 ポスター</p>
  <h1>左心耳閉鎖術における術前CT留置シミュレーションの検討</h1>
  <p class="by">綱木 達哉 ほか　豊橋ハートセンター</p>
</header>
<p class="note">ポスターに掲載した画像の動画版です。番号はポスターの項目番号に対応しています。動画は音声なしで、繰り返し再生されます。</p>

<section>
  <div class="sh"><span class="sn">03</span><h2>術前造影CT</h2></div>
  <figure>
    <video src="v/ct3d.mp4" poster="v/ct3d.jpg" autoplay muted loop playsinline controls preload="metadata"></video>
    <figcaption><b>左房・左心耳の3D VR</b>（回転表示）</figcaption>
  </figure>
</section>

<section>
  <div class="sh"><span class="sn">04</span><h2>方法：実物をそのままCT撮影し、3Dモデル化</h2></div>
  <div class="grid">
    <figure>
      <video class="wide" src="v/trusteer.mp4" poster="v/trusteer.jpg" autoplay muted loop playsinline controls preload="metadata"></video>
      <figcaption><b>A　TruSteer</b>：ダイヤルを回したときの先端カーブの変化</figcaption>
    </figure>
    <figure>
      <video src="v/device.mp4" poster="v/device.jpg" autoplay muted loop playsinline controls preload="metadata"></video>
      <figcaption><b>B　WATCHMAN FLX</b>：CTから作成した3Dモデル（35 mm・20%圧縮）</figcaption>
    </figure>
  </div>
</section>

<section>
  <div class="sh"><span class="sn">07</span><h2>手技と結果</h2></div>
  <figure>
    <video src="v/fluoro.mp4" poster="v/fluoro.jpg" autoplay muted loop playsinline controls preload="metadata"></video>
    <figcaption><b>留置時の透視</b>：TruSteer・Double CurveでFLX Pro 35 mmを留置</figcaption>
  </figure>
  <div class="grid">
    <figure>
      <video src="v/angio.mp4" poster="v/angio.jpg" autoplay muted loop playsinline controls preload="metadata"></video>
      <figcaption><b>留置後の造影</b></figcaption>
    </figure>
    <figure>
      <video class="wide" src="v/tee.mp4" poster="v/tee.jpg" autoplay muted loop playsinline controls preload="metadata"></video>
      <figcaption><b>留置後のTEE</b>：圧縮率 <span class="o">19.7–26%</span>、peridevice leakなし</figcaption>
    </figure>
  </div>
</section>

<footer>豊橋ハートセンター　放射線部・循環器内科・臨床工学部</footer>
</div>

</body>
</html>
